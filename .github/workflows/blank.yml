# This is a basic workflow to help you get started with Actions name: Build TapBurst APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TapBurst_Android_Starter_CasmirX.zip -d project

      - name: Build debug APK
        working-directory: project/TapBurst_Android_Starter
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapBurst-CasmirX-APK
          path: project/TapBurst_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
