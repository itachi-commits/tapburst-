# This is a basic workflow to help you get started with Actions name: Build TapBurst APK
name: Build TapBurst APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract project
        run: |
          unzip -o TapBurst_Android_Starter_CasmirX.zip -d project

      - name: Find project folder
        id: find
        run: |
          SETTINGS=$(find project -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found inside the ZIP"
            find project -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapBurst-CasmirX-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
