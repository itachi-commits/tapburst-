# This is a basic workflow to help you get started with Actions

name: Build TapBurst APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android project ZIP
        run: |
          unzip -q TapBurst_Android_Starter_CasmirX.zip -d project

      - name: Find Android project
        run: |
          find project -name gradlew -type f

      - name: Explain next step
        run: echo "Project files located. Checking Gradle wrapper next."
